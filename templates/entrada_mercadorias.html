{% extends "base.html" %}

{% block content %}

<h2>
    📦 Entrada de Mercadorias
</h2>

<form method="POST">

    <label>
        Código de Barras
    </label>

    <input
        type="text"
        name="codigo"
        autofocus
        required
    >

    <br><br>

    <label>
        Quantidade Recebida
    </label>

    <input
        type="number"
        name="quantidade"
        required
    >

    <br><br>

    <label>
        Observação
    </label>

    <textarea
        name="observacao"
        placeholder="Fornecedor, nota fiscal..."
    ></textarea>

    <br><br>

    <button
        type="submit"
        class="azul"
    >
        Registrar Entrada
    </button>

</form>

{% endblock %}
