{% extends "base.html" %}

{% block content %}

<h2>📋 Histórico de Entradas</h2>

<p>Total de registros: {{ entradas|length }}</p>

<table>
    <tr>
        <th>ID Produto</th>
        <th>Quantidade</th>
        <th>Observação</th>
    </tr>

    {% for entrada in entradas %}
    <tr>
        <td>{{ entrada.produto_id }}</td>
        <td>{{ entrada.quantidade }}</td>
        <td>{{ entrada.observacao }}</td>
    </tr>
    {% endfor %}

</table>

{% endblock %}
