<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">

<title>
Login
</title>

<style>

*{

    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;

}

body{

    background:#0f172a;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

}

.login{

    width:400px;

    background:white;

    padding:40px;

    border-radius:25px;

    box-shadow:0 0 30px rgba(
        0,
        0,
        0,
        0.3
    );

}

h1{

    text-align:center;

    margin-bottom:30px;

    color:#0f172a;

}

input{

    width:100%;

    padding:15px;

    border:1px solid #cbd5e1;

    border-radius:12px;

    margin-top:15px;

    font-size:16px;

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:12px;

    background:#2563eb;

    color:white;

    font-size:17px;

    cursor:pointer;

    margin-top:20px;

}

button:hover{

    background:#1d4ed8;

}

.erro{

    background:#dc2626;

    color:white;

    padding:12px;

    border-radius:10px;

    margin-top:15px;

    text-align:center;

}

</style>

</head>

<body>

<div class="login">

    <h1>

        FNM PRODUÇÕES

    </h1>

    <form method="POST">

        <input
            type="text"
            name="usuario"
            placeholder="Usuário"
            required
        >

        <input
            type="password"
            name="senha"
            placeholder="Senha"
            required
        >

        <button>

            Entrar

        </button>

    </form>

    {% with messages = get_flashed_messages() %}

        {% if messages %}

            <div class="erro">

                {{ messages[0] }}

            </div>

        {% endif %}

    {% endwith %}

</div>

</body>
</html>
